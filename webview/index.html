<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Calmppuccin Customization</title>
  </head>
  <body>
    <header class="header">
      <h1>Calmppuccin Customization</h1>
      <h2 id="current-flavor"></h2>
      <p>Changes are saved automatically. A reload is required to apply them globally.</p>
    </header>

    <div class="main-container">
      <div class="controls-column">
        <section class="card">
          <div class="card-header">
            <h3>Accent Color</h3>
          </div>
          <div class="card-body" id="accent-container">
            <div id="custom-accent-picker-container" style="display: none">
              <label for="custom-accent-hex-input">Custom Color:</label>
              <div class="syntax-picker-top-row">
                <input type="color" id="custom-accent-picker" />
                <input type="text" id="custom-accent-hex-input" class="hex-input-display" />
              </div>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="card-header">
            <h3>Font Styles & Syntax Colors</h3>
            <div class="language-selector-container">
              <select id="settings-view-select">
                <option value="syntax">Syntax</option>
                <option value="ui">UI</option>
                <option value="brackets">Brackets</option>
                <option value="json">JSON</option>
              </select>
            </div>
          </div>
          <div class="card-body" id="settings-container"></div>
        </section>

        <section class="card danger-zone">
          <div class="card-header">
            <h3>Danger Zone</h3>
          </div>
          <div class="card-body" id="reset-all-container"></div>
        </section>
      </div>

      <div class="preview-column">
        <section class="card">
          <div class="card-header">
            <h3>Live Preview</h3>
            <div class="language-selector-container">
              <select id="language-select"></select>
            </div>
          </div>
          <div class="preview-container">
            <div id="preview-pane" class="vscode-editor-mock">
              <pre><code id="code-preview">
                </code></pre>
            </div>
          </div>
        </section>
      </div>
    </div>

    <div id="reset-dialog-overlay" class="dialog-overlay hidden" style="opacity: 0; pointer-events: none">
      <div class="dialog-box">
        <h3>Confirm Reset</h3>
        <p>Are you sure you want to reset all Calmppuccin settings to their defaults? This action cannot be undone.</p>
        <div class="dialog-buttons">
          <button id="dialog-cancel-button" class="dialog-button secondary">Cancel</button>
          <button id="dialog-confirm-button" class="dialog-button danger">Reset Settings</button>
        </div>
      </div>
    </div>

    <script src="webview.js"></script>
  </body>
</html>
