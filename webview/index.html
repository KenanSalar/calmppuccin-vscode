<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calmppuccin Customization</title>
</head>
<body>
    <h1>Calmppuccin Customization</h1>
    <p>Changes are saved automatically. A reload is required to apply them.</p>

    <div id="accent-container" class="settings-section">
        <div id="custom-accent-picker-container" style="display: none;">
            <label for="custom-accent-picker">Custom Color:</label>
            <div class="color-picker-wrapper">
                <input type="color" id="custom-accent-picker">
                <input type="text" id="custom-accent-hex-input" maxlength="7">
            </div>
        </div>
    </div>

    <div id="font-styles-container" class="settings-section">
      <h2>Font Styles</h2>
      <div id="settings-container">
          </div>
    </div>
    
    <script src="webview.js"></script>
</body>
</html>
