name: Publish Dev Container

# Defines the trigger for this workflow.
on:
  # Runs on pushes to the 'dev' branch.
  push:
    branches:
      - dev
    # Only runs if files in the specified paths have been changed.
    # This prevents rebuilding the image on every commit, saving CI/CD resources.
    paths:
      - ".devcontainer/**"
      - "package-lock.json"

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    # Defines the permissions required by the job.
    permissions:
      contents: read
      # 'packages: write' is required to push images to the GitHub Container Registry (GHCR).
      packages: write 
    steps:
      # Fetches the repository source code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Authenticates the workflow to the GitHub Container Registry.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sets up the Docker builder engine.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds the image from the Dockerfile and pushes it to GHCR.
      # The image is tagged as 'latest' to be used by other workflows.
      - name: Build and push dev container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./.devcontainer/Dockerfile
          tags: ghcr.io/${{ github.repository_owner,, }}/calmppuccin-builder:latest
          push: true