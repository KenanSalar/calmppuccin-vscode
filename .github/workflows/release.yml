name: Build, Test, and Publish Extension

# This workflow runs on pushes to the main and dev branches.
on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write
  actions: write

jobs:
  # This job tests, builds, and packages the extension.
  build-and-package:
    runs-on: ubuntu-latest
    outputs:
      vsix_path: ${{ steps.find_vsix.outputs.vsix_path }}
      version: ${{ steps.get_version.outputs.current-version }}
    steps:
      # Checks out the repository's code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Sets up Docker Buildx for more advanced features like caching.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # This is the key change: We now cache the entire Docker image based on the Dockerfile's content.
      - name: Cache Docker Image
        uses: actions/cache@v4
        with:
          path: /tmp/docker-image.tar
          key: ${{ runner.os }}-docker-${{ hashFiles('./.devcontainer/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-docker-

      # Load the cached image if it exists.
      - name: Load Docker Image from Cache
        run: |
          if [ -f /tmp/docker-image.tar ]; then
            echo "Loading Docker image from cache..."
            docker load < /tmp/docker-image.tar
          else
            echo "No cached Docker image found."
          fi

      # Build the Docker image, which will be fast if the image was loaded from cache.
      - name: Build Dev Container Image
        uses: docker/build-push-action@v6
        with:
          context: ./.devcontainer
          tags: calmppuccin-builder:latest
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Save the new or updated image to the cache path.
      - name: Save Docker Image to Cache
        run: |
          echo "Saving Docker image to cache..."
          docker save calmppuccin-builder:latest > /tmp/docker-image.tar

      # Cache the project's node_modules directory.
      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: ./node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Installs only new dependencies, using the cache if available.
      - name: Install Dependencies
        run: npm install

      # Runs tests inside the container, using the already-installed node_modules.
      - name: Run Tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspaces/calmppuccin-vscode \
            -w /workspaces/calmppuccin-vscode \
            calmppuccin-builder \
            bash -c "npm test"

      - name: Get Package Version
        id: get_version
        uses: martinbeentjes/npm-get-version-action@v1.3.1

      # Builds and packages the extension inside the container.
      - name: Build and Package Extension
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspaces/calmppuccin-vscode \
            -w /workspaces/calmppuccin-vscode \
            calmppuccin-builder \
            bash -c "npm run package"

      - name: Find VSIX file
        id: find_vsix
        run: echo "vsix_path=$(ls *.vsix)" >> $GITHUB_OUTPUT

      # Uploads the generated .vsix file as a build artifact.
      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: calmppuccin-vsix
          path: "*.vsix"

  # This job ONLY runs on a push to the 'main' branch to publish the extension.
  publish-to-marketplace:
    if: github.ref == 'refs/heads/main'
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      # Downloads the .vsix file that was generated in the previous job.
      - name: Download VSIX Artifact
        uses: actions/download-artifact@v4
        with:
          name: calmppuccin-vsix

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install vsce
        run: npm install -g @vscode/vsce

      # Publishes the extension to the VS Code Marketplace.
      - name: Publish to VS Code Marketplace
        run: vsce publish -p ${{ secrets.VSCE_PAT }} --packagePath ${{ needs.build-and-package.outputs.vsix_path }}

      # Creates a new GitHub Release and attaches the .vsix file.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.build-and-package.outputs.version }}"
          name: "Release v${{ needs.build-and-package.outputs.version }}"
          files: ${{ needs.build-and-package.outputs.vsix_path }}