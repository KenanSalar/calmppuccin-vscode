# .github/workflows/release.yml
name: Build, Test, and Publish Extension

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  packages: write # 'write' is needed here for the conditional push step

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    outputs:
      vsix_path: ${{ steps.find_vsix.outputs.vsix_path }}
      version: ${{ steps.get_version.outputs.current-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # This step checks which files have changed.
      - name: Check for changes in container definition
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            container_files:
              - '.devcontainer/**'
              - 'package-lock.json'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # This step ONLY runs if container files changed on the 'dev' branch.
      - name: Build and push new container image
        if: steps.filter.outputs.container_files == 'true' && github.ref == 'refs/heads/dev'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./.devcontainer/Dockerfile
          tags: ghcr.io/${{ github.repository_owner,, }}/calmppuccin-builder:latest
          push: true
          
      # This step always runs to ensure the latest image is available for subsequent steps.
      - name: Pull Dev Container Image
        run: docker pull ghcr.io/${{ github.repository_owner,, }}/calmppuccin-builder:latest

      - name: Run Tests
        run: docker run --rm --workdir /workspaces/calmppuccin-vscode ghcr.io/${{ github.repository_owner,, }}/calmppuccin-builder:latest npm test

      - name: Get Package Version
        id: get_version
        uses: martinbeentjes/npm-get-version-action@v1.3.1

      - name: Build and Package Extension
        run: |
          set -euo pipefail
          docker run --rm \
            -u 0 \
            -v "$PWD":/out \
            --workdir /workspaces/calmppuccin-vscode \
            ghcr.io/${{ github.repository_owner,, }}/calmppuccin-builder:latest \
            sh -lc 'npm run package && cp /workspaces/calmppuccin-vscode/*.vsix /out/'

      - name: Find VSIX file
        id: find_vsix
        run: |
          set -euo pipefail
          VSIX=$(ls -1 *.vsix)
          echo "vsix_path=${VSIX}" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: calmppuccin-vsix
          path: "*.vsix"

      # This job now only needs to exist once, as part of the main job on the 'main' branch
      - name: Publish to VS Code Marketplace and Create Release
        if: github.ref == 'refs/heads/main'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npm install -g @vscode/vsce
          vsce publish --packagePath ${{ steps.find_vsix.outputs.vsix_path }}
          gh release create "v${{ steps.get_version.outputs.current-version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release v${{ steps.get_version.outputs.current-version }}" \
            --notes "New release." \
            "${{ steps.find_vsix.outputs.vsix_path }}"