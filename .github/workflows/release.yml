name: Release

# A pushed `v*.*.*` tag publishes the version in package.json, which `prepare`
# requires the tag to match. Merging to main publishes nothing.

on:
  push:
    tags:
      - "v*.*.*"
  # Re-runs a release: pick the tag, not a branch, in the ref dropdown.
  workflow_dispatch:

permissions:
  contents: read

# Releases share the marketplaces, not a ref, so one group for every run.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      # Full history so the tagged commit can be checked against main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the tag matches package.json and is on main
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "::error::Run this on a release tag, not on branch $REF_NAME."
            exit 1
          fi

          VERSION="$(jq -r .version package.json)"
          if [[ "$REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $REF_NAME does not match package.json's v$VERSION."
            echo "::error::Bump the version on main, then tag that commit."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $REF_NAME points at a commit that is not on main."
            exit 1
          fi
          echo "Releasing $REF_NAME"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

  # Every step skips what already exists, so a re-run after a partial failure
  # finishes the release instead of failing on the half that went out.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: vsix

      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath vsix/*.vsix --skip-duplicate

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish vsix/*.vsix --skip-duplicate

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" vsix/*.vsix --clobber
          else
            gh release create "$TAG" vsix/*.vsix \
              --verify-tag \
              --title "Release $TAG" \
              --generate-notes
          fi
