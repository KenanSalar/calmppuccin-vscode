name: Build and Release Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  packages: write

jobs:
  # Build and package the extension
  build:
    runs-on: ubuntu-latest
    # Define job outputs for the release job
    outputs:
      vsix_path: ${{ steps.find_vsix.outputs.vsix_path }}
      version: ${{ steps.get_version.outputs.current-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for changes in container definition
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            container_files:
              - '.devcontainer/**'
              - 'package-lock.json'

      - name: Set lowercase OWNER
        id: set_owner 
        run: echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build image only on 'dev' if container files change
      - name: Build and push new container image
        if: steps.filter.outputs.container_files == 'true' && github.ref == 'refs/heads/dev'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./.devcontainer/Dockerfile
          tags: ghcr.io/${{ steps.set_owner.outputs.owner_lc }}/calmppuccin-builder:latest
          push: true
          cache-from: type=gha,scope=builder-cache
          cache-to: type=gha,scope=builder-cache,mode=max
          
      - name: Pull Dev Container Image
        run: docker pull ghcr.io/${{ steps.set_owner.outputs.owner_lc }}/calmppuccin-builder:latest

      - name: Get Package Version
        id: get_version
        uses: martinbeentjes/npm-get-version-action@v1.3.1

      - name: Build and Package Extension
        run: |
          set -euo pipefail
          docker run --rm \
            -u 0 \
            -e NODE_ENV=production \
            -v "$PWD":/out \
            --workdir /workspaces/calmppuccin-vscode \
            ghcr.io/${{ steps.set_owner.outputs.owner_lc }}/calmppuccin-builder:latest \
            sh -lc 'npm run package && cp /workspaces/calmppuccin-vscode/*.vsix /out/'

      - name: Find VSIX file
        id: find_vsix
        run: |
          set -euo pipefail
          VSIX=$(ls -1 *.vsix)
          echo "vsix_path=${VSIX}" >> "$GITHUB_OUTPUT"
          echo "Found VSIX: ${VSIX}"

      # Upload VSIX as an artifact for the release job
      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: calmppuccin-vsix
          path: "*.vsix"

  # Download artifact and publish the release
  release:
    runs-on: ubuntu-latest
    # Run this job only on the 'main' branch
    if: github.ref == 'refs/heads/main'
    # Requires the 'build' job to succeed
    needs: build
    steps:
      # Download the VSIX package from the previous job
      - name: Download VSIX Artifact
        uses: actions/download-artifact@v4
        with:
          name: calmppuccin-vsix

      - name: Display structure of downloaded files
        run: ls -R

      - name: Publish to VS Code Marketplace and Create Release
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"
          VSIX_PATH="${{ needs.build.outputs.vsix_path }}"
          
          echo "Version: ${VERSION}"
          echo "VSIX Path: ${VSIX_PATH}"

          npm install -g @vscode/vsce
          vsce publish --packagePath "${VSIX_PATH}"
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release v${VERSION}" \
            --notes "New release." \
            "${VSIX_PATH}"