name: Build, Test, and Publish Extension

# This workflow runs on pushes to the main and dev branches.
on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write
  actions: write

jobs:
  # This job tests, builds, and packages the extension.
  build-and-package:
    runs-on: ubuntu-latest
    outputs:
      vsix_path: ${{ steps.find_vsix.outputs.vsix_path }}
      version: ${{ steps.get_version.outputs.current-version }}
    steps:
      # Checks out the repository's code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Sets up Docker Buildx for more advanced features like caching.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      # Builds the Docker image. Caching is now optimized within the Dockerfile.
      - name: Build Dev Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./.devcontainer/Dockerfile
          tags: calmppuccin-builder:latest
          load: true
          cache-from: type=gha,scope=dev-container-cache
          cache-to: type=gha,mode=max,scope=dev-container-cache

      # Runs tests inside the self-contained Docker image.
      - name: Run Tests
        run: docker run --rm --workdir /workspaces/calmppuccin-vscode calmppuccin-builder npm test

      - name: Get Package Version
        id: get_version
        uses: martinbeentjes/npm-get-version-action@v1.3.1

      # Builds and packages the extension, then copies the .vsix file out of the container.
      - name: Build and Package Extension
        run: |
          docker run --name builder-container --workdir /workspaces/calmppuccin-vscode calmppuccin-builder npm run package
          docker cp builder-container:/workspaces/calmppuccin-vscode/calmppuccin-vscode-*.vsix .
          docker rm builder-container

      - name: Find VSIX file
        id: find_vsix
        run: echo "vsix_path=$(ls *.vsix)" >> $GITHUB_OUTPUT

      # Uploads the generated .vsix file as a build artifact.
      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: calmppuccin-vsix
          path: "*.vsix"

  # This job ONLY runs on a push to the 'main' branch to publish the extension.
  publish-to-marketplace:
    if: github.ref == 'refs/heads/main'
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      # Downloads the .vsix file that was generated in the previous job.
      - name: Download VSIX Artifact
        uses: actions/download-artifact@v4
        with:
          name: calmppuccin-vsix

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install vsce
        run: npm install -g @vscode/vsce

      # Publishes the extension to the VS Code Marketplace.
      - name: Publish to VS Code Marketplace
        run: vsce publish -p ${{ secrets.VSCE_PAT }} --packagePath ${{ needs.build-and-package.outputs.vsix_path }}

      # Creates a new GitHub Release and attaches the .vsix file.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.build-and-package.outputs.version }}"
          name: "Release v${{ needs.build-and-package.outputs.version }}"
          files: ${{ needs.build-and-package.outputs.vsix_path }}