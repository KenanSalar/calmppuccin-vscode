name: Build, Test, and Publish Extension

# This workflow runs on pushes to the main and dev branches
on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write

jobs:
  # This job tests, builds, and packages the extension on pushes to EITHER main or dev
  build-and-package:
    runs-on: ubuntu-latest
    outputs:
      vsix_path: ${{ steps.find_vsix.outputs.vsix_path }}
      version: ${{ steps.get_version.outputs.current-version }}
    steps:
      # Checks out the repository's code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Docker Buildx for caching.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Cache Docker layers between runs.
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # Cache npm's global cache directory.
      # This will make 'npm install' almost instantaneous if package-lock.json hasn't changed.
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Run unit and integration tests inside the container
      # It runs before the packaging step to ensure only tested code proceeds.
      - name: Build Dev Container Image
        uses: docker/build-push-action@v6
        with:
          context: ./.devcontainer
          tags: calmppuccin-builder:latest
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # This is a necessary workaround to persist the cache correctly for the next run.
      - name: Move Docker cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Run Tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspaces/calmppuccin-vscode \
            -w /workspaces/calmppuccin-vscode \
            calmppuccin-builder \
            bash -c "npm install && npm test"

      - name: Get Package Version
        id: get_version
        uses: martinbeentjes/npm-get-version-action@v1.3.1

      # Run build and package commands *inside* the container
      # This step only runs if the tests in the previous step have passed.
      - name: Build and Package Extension
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspaces/calmppuccin-vscode \
            -w /workspaces/calmppuccin-vscode \
            calmppuccin-builder \
            bash -c "npm install && npm run package"

      - name: Find VSIX file
        id: find_vsix
        run: echo "vsix_path=$(ls *.vsix)" >> $GITHUB_OUTPUT

      # Upload the generated .vsix file as a build artifact
      # This artifact will be used by the publishing job.
      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: calmppuccin-vsix
          path: "*.vsix"

  # This job ONLY runs on a push to the 'main' branch
  publish-to-marketplace:
    # This condition ensures the job only runs for the main branch
    if: github.ref == 'refs/heads/main'
    # It requires the 'build-and-package' job (including tests) to have completed successfully
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      # Download the .vsix file that was generated in the previous job
      - name: Download VSIX Artifact
        uses: actions/download-artifact@v4
        with:
          name: calmppuccin-vsix

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install vsce
        run: npm install -g @vscode/vsce

      # Publish the extension to the VS Code Marketplace
      - name: Publish to VS Code Marketplace
        run: vsce publish -p ${{ secrets.VSCE_PAT }} --packagePath ${{ needs.build-and-package.outputs.vsix_path }}

      # Create a GitHub Release and upload the .vsix file
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.build-and-package.outputs.version }}"
          name: "Release v${{ needs.build-and-package.outputs.version }}"
          files: ${{ needs.build-and-package.outputs.vsix_path }}
