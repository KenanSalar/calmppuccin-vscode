name: Build, Test, and Publish Extension

# This workflow runs on pushes to the main and dev branches
on:
  push:
    branches:
      - main
      - dev

jobs:
  # This job builds and packages the extension on pushes to EITHER main or dev
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out your repository's code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Build the Docker image using the Dockerfile from your dev container setup
      - name: Build Dev Container Image
        run: docker build -t calmppuccin-builder ./.devcontainer

      # 3. Run build and package commands *inside* the container
      # This step only packages the extension, it does not publish it.
      - name: Build and Package Extension
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspaces/calmppuccin-vscode-g \
            -w /workspaces/calmppuccin-vscode-g \
            calmppuccin-builder \
            bash -c "npm install && vsce package --no-dependencies"
      
      # 4. Upload the generated .vsix file as a build artifact
      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: calmppuccin-vsix
          path: "*.vsix"

  # This job ONLY runs on a push to the 'main' branch
  publish-to-marketplace:
    # This condition ensures the job only runs for the main branch
    if: github.ref == 'refs/heads/main'
    
    # It requires the 'build-and-package' job to have completed successfully
    needs: build-and-package
    
    runs-on: ubuntu-latest
    steps:
      # 1. Download the .vsix file that was created in the previous job
      - name: Download VSIX Artifact
        uses: actions/download-artifact@v4
        with:
          name: calmppuccin-vsix

      # 2. Publish the extension to the VS Code Marketplace
      - name: Publish to VS Code Marketplace
        uses: HaaLeo/publish-vscode-extension@v1
        with:
          pat: ${{ secrets.VSCE_PAT }}
          packagePath: "*.vsix"
